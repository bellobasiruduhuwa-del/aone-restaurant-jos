name: Build check

# Runs automatically on every push and every pull request against main.
# It just makes sure the app still builds cleanly — it does NOT deploy
# anything (Vercel handles deploys separately). If this fails, GitHub
# will show a red ✗ next to the commit so a broken change gets noticed
# right away instead of only being caught after it goes live.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
